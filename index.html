<meta name="description" content="Le questionnaire de L'Équipage pour choisir un film ou un jeu Steam à plusieurs.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Séance à deux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : une salle de cinéma la nuit — un ticket central qui avance écran par écran, puis une affiche des résultats */
:root{
  --velvet:#1a0f17; --velvet-2:#26161f; --seat:#3a2230;
  --marquee:#f4b63f; --bulb:#ffe3a3; --ink:#f3e9e4; --muted:#b9a3ad; --line:#4a2d3c; --red:#e2574c;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Work Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--velvet);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;
  background-image:radial-gradient(ellipse 80% 40% at 50% 0%, #3b1d2c 0%, transparent 70%);min-height:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.bulbs{display:flex;gap:10px;justify-content:center}
.bulbs i{width:7px;height:7px;border-radius:50%;background:var(--bulb);box-shadow:0 0 8px var(--marquee);animation:blink 2.4s infinite}
.bulbs i:nth-child(2n){animation-delay:1.2s}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bulbs i{animation:none}}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,11vw,76px);line-height:.95;letter-spacing:.02em;margin:0;color:var(--marquee);
  text-transform:uppercase;text-shadow:0 0 22px rgba(244,182,63,.35);text-wrap:balance}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.ticket{background:var(--velvet-2);border:1px solid var(--line);border-radius:6px;position:relative;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--velvet);border:1px solid var(--line);transform:translateY(-50%)}
.ticket::before{left:-12px;clip-path:inset(0 0 0 50%)} .ticket::after{right:-12px;clip-path:inset(0 50% 0 0)}
.stub{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px dashed var(--line);padding-bottom:12px}
.stub b{color:var(--marquee);font-weight:500}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,34px);line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.hint{color:var(--muted);margin:-10px 0 0;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--velvet);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--marquee);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--marquee);background:#3a2418}
.opt strong{font-weight:600;font-size:15px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"] strong{color:var(--marquee)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.names{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:500 16px var(--f-body);color:var(--ink);background:var(--velvet);border:1px solid var(--line);border-radius:4px;padding:12px;letter-spacing:0;text-transform:none}
input[type=text]:focus{outline:2px solid var(--marquee);outline-offset:1px;border-color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:18px;padding:12px 22px;border-radius:4px;background:var(--marquee);color:var(--velvet)}
.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--bulb);outline-offset:3px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.ghost{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress div{height:100%;background:var(--marquee);transition:width .25s}
.pass{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-block:20px}
.pass p{color:var(--muted);margin:0;max-width:40ch}

.results{display:flex;flex-direction:column;gap:14px}
.film{display:grid;grid-template-columns:64px 1fr;gap:16px;background:var(--velvet-2);border:1px solid var(--line);border-radius:6px;padding:16px}
.film.top{border-color:var(--marquee)}
.rank{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--marquee);text-align:center}
.rank small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.fbody{min-width:0;display:flex;flex-direction:column;gap:8px}
.ftitle{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;margin:0}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pitch{margin:0;font-size:14px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar div{height:100%;background:var(--marquee)}
.bar.b2 div{background:var(--bulb)}
.why{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted)}
.factions{display:flex;gap:16px;flex-wrap:wrap}
.factions a{color:var(--marquee);font-family:var(--f-mono);font-size:12px}
.sum{font-size:14px;color:var(--muted);margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--velvet);border:1px solid var(--line);border-radius:6px;padding:4px}
.tabb{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:4px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:16px;color:var(--muted)}
.tabb[aria-selected="true"]{background:var(--marquee);color:var(--velvet)}
.tabb:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.expl{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.vline{margin:0;font-weight:600;color:var(--bulb);font-size:14px}
.expl b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.pro b{color:var(--marquee)} .con b{color:var(--red)}
.expl ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.con ul{color:var(--muted)}
.flag{width:120px;height:auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));transform-origin:8% 50%;animation:flap 4s ease-in-out infinite}
@keyframes flap{50%{transform:skewY(-2deg) scaleX(.98)}}
@media (prefers-reduced-motion:reduce){.flag{animation:none}}
.count{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seats{display:flex;gap:6px}
.seat{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.seat[aria-pressed="true"]{background:var(--marquee);border-color:var(--marquee);color:var(--velvet)}
.seat:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.names{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important}
footer{text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
</style>

</head>

   ["pvp","Le versus","Je ne veux pas jouer contre mon pote"],["none","Rien de tout ça","Je suis chaud pour tout"]]},
 TIRED
];

// ——————————————————— SCORES
function moodScore(item,a,labels,why){
  const mood=a.mood||[]; const hit=mood.filter(m=>item.m.includes(m));
  if(!hit.length)return 0;
  why.push(...hit.map(h=>labels[h]));
  return (hit.includes(mood[0])?40:28)+(hit.length>1?6:0);
}
function gemScore(item,a,why){
  if(a.gem==="gem"){ if(item.gem){why.push("Pépite");return 14;} return -4; }
  if(a.gem==="cult") return item.gem?-2:12;
  if(item.gem)why.push("Pépite"); return 8;
}
function scoreFilm(f,a){
  const why=[]; let s=moodScore(f,a,MOODS,why);
  s+=[20,8,-12][Math.abs(f.i-a.int)];
  s+=gemScore(f,a,why);
  if(a.era==="any")s+=10; else if(a.era==="old"?f.y<2000:f.y>2010)s+=10; else s-=4;
  if(a.lang==="any")s+=f.l==="fr"||f.l==="en"?8:12;
  else if(a.lang===f.l)s+=10; else if(f.l!=="fr"&&f.l!=="en")s-=10;
  if(a.tired==="zombie"){ if(f.d>125)s-=15; if(f.m.includes("cerveau"))s-=8; if(f.i===1)s+=5; }
  if(a.tired==="meh"&&f.d>145)s-=8;
  if(a.tired==="fresh"&&f.m.includes("cerveau"))s+=3;
  return {pct:Math.max(0,Math.min(100,Math.round(s/104*100))),why};
}
function scoreGame(g,a){
  const why=[]; let s=moodScore(g,a,GMOODS,why);
  if(a.mode==="any")s+=12; else if(g.mode.includes(a.mode)){s+=16;why.push(a.mode==="c"?"Coop":"Versus");} else s-=10;
  s+=[18,6,-10][Math.abs(g.e-a.eng)];
  s+=gemScore(g,a,why);
  if(g.price===0)s+=4;
  if(a.tired==="zombie"){ if(g.e===3)s-=12; if(g.m.includes("cerveau"))s-=8; if(g.m.includes("chill")||g.m.includes("rire"))s+=6; }
  if(a.tired==="meh"&&g.e===3)s-=5;
  if(a.tired==="fresh"&&g.m.includes("cerveau"))s+=3;
  return {pct:Math.max(0,Math.min(100,Math.round(s/100*100))),why};
}

const MODES={
 film:{items:FILMS,Q:QF,score:scoreFilm,noun:"films",kicker:"films, cultes, pépites et français",

   rule(AS){return `Durée max : ${fmt(Math.min(180,...AS.map(a=>a.dur)))}, respectée pour chaque film.`;},

   seen:"Déjà vu, au suivant"},
 game:{items:GAMES,Q:QG,score:scoreGame,noun:"jeux",kicker:"jeux Steam jouables en ligne entre potes",
   h1:()=>"Soirée jeux à "+NUM[S.n],
   ask:"Qui est sur Discord ce soir ?",verdict:"Ce soir, on lance",go:"Lancer la soirée",seat:"Joueur",
   filter(AS){const max=Math.min(...AS.map(a=>a.budget??999)),no=new Set(AS.flatMap(a=>a.no||[]));
     return this.items.filter(g=>g.max>=S.n&&g.price<=max&&!(no.has("horror")&&g.horror)&&!(no.has("shooter")&&g.shooter)&&!(no.has("pvp")&&g.mode==="v"));},
   rule(AS){const m=Math.min(...AS.map(a=>a.budget));return `Seuls les jeux jouables à ${S.n} sont gardés. `+(m===0?"Budget : gratuit uniquement.":m<999?`Budget : ${m} € max par personne, respecté pour chaque jeu.`:"Budget libre.");},
   meta:g=>[g.y,g.price===0?"Gratuit":"≈ "+g.price+" €",g.mode==="c"?"Coop":g.mode==="v"?"Versus":"Coop et versus","Jusqu'à "+g.max+" joueurs","●".repeat(g.e)+"○".repeat(3-g.e)+" engagement"],
   link:g=>["https://store.steampowered.com/search/?term="+encodeURIComponent(g.t),"Voir sur Steam"],
   seen:"On l'a déjà, au suivant"}
};

// ——————————————————— EXPLICATIONS
const ENG=["","une soirée","quelques soirées","des semaines"],INT=["","tranquille","équilibrée","intense"];
const P=()=>[...Array(S.n).keys()];
const listNames=idx=>{const n=idx.map(nm);return n.length<2?n.join(""):n.slice(0,-1).join(", ")+" et "+n[n.length-1];};
function whoI(idx){return !idx.length?"":idx.length===S.n?(S.n===2?"vous deux":"vous tous"):listNames(idx);}
function who(pred){return whoI(P().filter(i=>pred(S.ans[i])));}
const plural=w=>w.startsWith("vous")?"êtes":w.includes(" et ")?"sont":"est";
const isPl=w=>w.startsWith("vous")||w.includes(" et ");
const comme=w=>w.startsWith("vous")?"comme vous le vouliez":`comme le ${isPl(w)?"voulaient":"voulait"} ${w}`;
const alors=w=>w.startsWith("vous")?"vous vouliez":`${w} ${isPl(w)?"voulaient":"voulait"}`;
function explain(f){
  const pros=[],cons=[],film=S.mode==="film",L=film?MOODS:GMOODS;
  const lab=h=>h.map(x=>L[x].toLowerCase()).join(" et ");
  const hits=P().map(i=>(S.ans[i].mood||[]).filter(m=>f.m.includes(m)));
  const yes=P().filter(i=>hits[i].length),no=P().filter(i=>!hits[i].length);
  if(yes.length===S.n){
    const same=hits.every(h=>h.join()===hits[0].join());
    pros.push(same?`Il coche l'envie que vous avez en commun : ${lab(hits[0])}.`:`Il coche les envies de chacun : ${yes.map(i=>`${lab(hits[i])} pour ${nm(i)}`).join(", ")}.`);
  } else if(yes.length){
    pros.push(`Il répond ${yes.length>1?"aux envies":"à l'envie"} de ${yes.map(i=>`${nm(i)} (${lab(hits[i])})`).join(", ")}.`);
    no.forEach(i=>cons.push(`${nm(i)} voulait plutôt ${lab(S.ans[i].mood||[])}. C'est le compromis.`));
  }
  if(film){
    if(P().every(i=>S.ans[i].int===f.i))pros.push(`Intensité ${INT[f.i]}, pile ce que vous avez tous demandé.`);
    else P().forEach(i=>{const d=f.i-S.ans[i].int;if(d)cons.push(`${d>0?"Plus intense":"Plus léger"} que ce que voulait ${nm(i)} (${INT[f.i]}).`);});
    const max=Math.min(...P().map(i=>S.ans[i].dur));
    pros.push(max<999?`${fmt(f.d)} : ça rentre dans votre limite de ${fmt(max)}.`:`${fmt(f.d)} au compteur.`);
    const z=who(a=>a.tired==="zombie");
    if(z&&f.d<=100)pros.push(`Court et sans prise de tête, adapté à la fatigue de ${z}.`);
    const fr=who(a=>a.lang==="fr");
    if(f.l==="fr"&&fr)pros.push(`Film français, ${comme(fr)}.`);
    if(f.l!=="fr"&&f.l!=="en"){const op=who(a=>a.lang==="any");if(op)pros.push(`${LANG[f.l]} : ${op} ${plural(op)} prêt${op.includes(" et ")||op.startsWith("vous")?"s":""} pour les sous-titres.`);}
    const okE=who(a=>a.era==="old"&&f.y<2000||a.era==="new"&&f.y>2010);
    if(okE)pros.push(f.y<2000?`Un classique de ${f.y}, ${comme(okE)}.`:`Sorti en ${f.y}, assez récent pour ${okE}.`);
    P().forEach(i=>{const e=S.ans[i].era;if(e==="old"&&f.y>=2000||e==="new"&&f.y<=2010)cons.push(`Sorti en ${f.y}, ${nm(i)} préférait ${e==="old"?"un classique":"du récent"}.`);});
  } else {
    if(S.n>2)pros.push(`Jouable jusqu'à ${f.max}, donc toute la bande y tient.`);
    const c=who(a=>a.mode==="c"),v=who(a=>a.mode==="v");
    if(c&&f.mode.includes("c"))pros.push(`Se joue en coop, ${comme(c)}.`);
    if(v&&f.mode.includes("v"))pros.push(`Propose du versus, ${comme(v)}.`);
    if(c&&!f.mode.includes("c"))cons.push(`Uniquement en versus alors que ${alors(c)} de la coop.`);
    if(v&&!f.mode.includes("v"))cons.push(`Uniquement en coop alors que ${alors(v)} s'affronter.`);
    const max=Math.min(...P().map(i=>S.ans[i].budget));
    pros.push(f.price===0?"Gratuit : vous pouvez lancer tout de suite.":max<999?`Environ ${f.price} € chacun, dans votre budget de ${max} €.`:`Environ ${f.price} € chacun.`);
    if(P().every(i=>S.ans[i].eng===f.e))pros.push(`Engagement prévu : ${ENG[f.e]}, exactement ce que vous visiez.`);
    else P().forEach(i=>{const d=f.e-S.ans[i].eng;if(d)cons.push(d>0?`Demande plus de temps (${ENG[f.e]}) que ce que ${nm(i)} voulait donner.`:`Plus court que ce que ${nm(i)} cherchait : on en fait vite le tour.`);});
    const z=who(a=>a.tired==="zombie");
    if(z&&f.e===1)pros.push(`Prise en main immédiate, parfait pour l'état de ${z}.`);
  }
  const gm=who(a=>a.gem==="gem"),cl=who(a=>a.gem==="cult");
  if(f.gem&&gm)pros.push(`Une pépite moins connue, ${comme(gm)}.`);
  if(!f.gem&&cl)pros.push(`Une valeur sûre, ${comme(cl)}.`);
  return {pros,cons};
}
function verdictLine(r,i){
  const ps=r.s.map(x=>x.pct),hi=Math.max(...ps),lo=Math.min(...ps);
  const top=P().filter(k=>ps[k]===hi),bot=P().filter(k=>ps[k]===lo);
  if(hi-lo<=10)return i===0?"Le meilleur accord de la soirée : vous êtes quasiment tous au même niveau d'envie.":"Vous êtes d'accord dessus.";
  return i===0?`Le meilleur compromis : ${whoI(top)} ${top.length>1?"sont":"est"} le plus emballé, mais ${whoI(bot)} y trouve${bot.length>1?"nt":""} son compte.`
             :`Plutôt pour ${whoI(top)}, ${whoI(bot)} suivra${bot.length>1?"ont":""}.`;
}

// ——————————————————— ÉTAT ET RENDU
const S={mode:"film",n:2,step:"intro",names:["Hugo","Greg","","","",""],p:0,q:0,ans:[{},{}],removed:new Set(),shown:6};
const M=()=>MODES[S.mode];
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=i=>S.names[i].trim()||(M().seat+" "+(i+1));
function fmt(d){return Math.floor(d/60)+" h "+String(d%60).padStart(2,"0");}
function reset(){S.ans=P().map(()=>({}));S.removed.clear();S.shown=6;}
function eligible(){return M().filter(S.ans);}
function ranked(){
  return eligible().filter(f=>!S.removed.has(f.id)).map(f=>{
    const s=S.ans.map(a=>M().score(f,a)),ps=s.map(x=>x.pct);
    const tot=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length-(Math.max(...ps)-Math.min(...ps))*0.25);
    return {f,s,tot:Math.max(0,tot)};
  }).sort((x,y)=>y.tot-x.tot);
}
function setHeader(){
  document.getElementById("h1").textContent=M().h1();
  document.getElementById("kick").textContent=`${M().Q.length} questions chacun · ${M().items.length} ${M().kicker} · 1 verdict`;
}

function render(){
  setHeader();
  const Q=M().Q;
  if(S.step==="intro"){
    app.innerHTML=`<section class="ticket">
      <div class="stub"><span>Admission · <b>${S.n} personnes</b></span><span>Salle L'Équipage · Séance de nuit</span></div>
      <div class="tabs" role="tablist" aria-label="Rubrique">
        <button role="tab" class="tabb" data-m="film" aria-selected="${S.mode==="film"}">Soirée film</button>
        <button role="tab" class="tabb" data-m="game" aria-selected="${S.mode==="game"}">Soirée jeux Steam</button>
      </div>
      <h2>${M().ask}</h2>
      <div class="count"><span class="tag">Combien vous êtes ?</span>
        <div class="seats">${[2,3,4,5,6].map(k=>`<button class="seat" data-n="${k}" aria-pressed="${S.n===k}">${k}</button>`).join("")}</div></div>
      <p class="hint">Chacun répond à ${Q.length} questions de son côté. On croise vos envies et on vous sort les ${M().noun} où vous tombez d'accord.</p>
      <div class="names">${P().map(i=>`<label for="n${i}">${M().seat} ${i+1}<input type="text" id="n${i}" data-i="${i}" placeholder="${i===0?"Ton prénom":"Prénom"}" value="${esc(S.names[i])}" autocomplete="off"></label>`).join("")}</div>
      <div class="row"><span class="tag">Durée : ${S.n} minutes environ</span><button class="btn" id="go">${M().go}</button></div>
    </section>`;
    app.querySelectorAll(".tabb").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;reset();render();});
    app.querySelectorAll(".seat").forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;reset();render();});
    app.querySelectorAll(".names input").forEach(inp=>inp.oninput=e=>S.names[+e.target.dataset.i]=e.target.value);
    app.querySelector("#go").onclick=()=>{reset();S.step="pass";S.p=0;render();};
    return;
  }
  if(S.step==="pass"){
    app.innerHTML=`<section class="ticket pass">
      <div class="tag">${S.p===0?"Premier passage":`Passage ${S.p+1} sur ${S.n}`}</div>
      <h2>À ${esc(nm(S.p))} de jouer</h2>
      <p>${S.p===0?"Réponds sans montrer l'écran, pour ne pas influencer les autres.":"Passe le téléphone. "+esc(nm(S.p-1))+" a fini, interdiction de regarder ses réponses."}</p>
      <button class="btn" id="go">C'est moi, on y va</button>
    </section>`;
    app.querySelector("#go").onclick=()=>{S.step="q";S.q=0;render();};
    return;
  }
  if(S.step==="q"){
    const q=Q[S.q],a=S.ans[S.p],cur=a[q.k];
    const done=(S.p*Q.length+S.q)/(Q.length*S.n)*100;
    const sel=v=>q.multi?(cur||[]).includes(v):cur===v;
    const ok=q.multi?(cur||[]).length>0:cur!==undefined;
    app.innerHTML=`<section class="ticket">
      <div class="stub"><span><b>${esc(nm(S.p))}</b> · ${S.p+1}/${S.n}</span><span>Question ${S.q+1} / ${Q.length}</span></div>
      <div class="progress" aria-hidden="true"><div style="width:${done}%"></div></div>
      <h2>${q.h}</h2>${q.s?`<p class="hint">${q.s}</p>`:""}
      <div class="opts">${q.o.map(([v,t,d],i)=>`<button class="opt" data-i="${i}" aria-pressed="${sel(v)}"><strong>${t}</strong><span>${d}</span></button>`).join("")}</div>
      <div class="row"><button class="ghost" id="back">${S.q===0&&S.p===0?"Retour":"Question précédente"}</button>
      ${q.multi?`<button class="btn" id="next" ${ok?"":"disabled"}>Suivant</button>`:`<span class="tag">Un clic suffit</span>`}</div>
    </section>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const v=q.o[+b.dataset.i][0];
      if(q.multi){let arr=[...(a[q.k]||[])];
        if(arr.includes(v))arr=arr.filter(x=>x!==v);
        else if(q.none&&v===q.none)arr=[v];
        else{arr=arr.filter(x=>x!==q.none);arr.push(v); if(arr.length>q.multi)arr.shift();}
        a[q.k]=arr; render();}
      else{a[q.k]=v; next();}
    });
    const nx=app.querySelector("#next"); if(nx)nx.onclick=()=>{if(ok)next();};
    app.querySelector("#back").onclick=back;
    return;
  }
  if(S.step==="res"){
    const md=M(),list=ranked().slice(0,S.shown);
    app.innerHTML=`<section class="results">
      <div class="ticket" style="gap:10px">
        <div class="stub"><span>Verdict · <b>${esc(listNames(P()))}</b></span><span>${eligible().length} ${md.noun} retenus sur ${md.items.length}</span></div>
        <h2>${md.verdict}</h2>
        ${list.length?"":`<p class="sum"><b>Rien ne passe tous vos filtres.</b> Assouplissez vos limites ou vos exclusions.</p>`}
        <p class="sum">${md.rule(S.ans)} Classés selon les envies de chacun : si l'un adore et un autre déteste, ça descend dans la liste. Déjà fait ? Retirez-le, le suivant prend sa place.</p>
      </div>
      ${list.map((r,i)=>{const [href,lab]=md.link(r.f),x=explain(r.f);return `<article class="film${i===0?" top":""}">
        <div class="rank">${i+1}<small>${r.tot}%</small></div>
        <div class="fbody">
          <h3 class="ftitle">${esc(r.f.t)}</h3>
          <div class="meta">${md.meta(r.f).map(m=>`<span>${m}</span>`).join("")}</div>
          <p class="pitch">${esc(r.f.p)}</p>
          <div class="bars">${r.s.map((s,k)=>`<span>${esc(nm(k))}</span><div class="bar${k%2?" b2":""}"><div style="width:${s.pct}%"></div></div><span>${s.pct}%</span>`).join("")}</div>
          <div class="expl"><p class="vline">${esc(verdictLine(r,i))}</p>
            <div class="pro"><b>Pourquoi c'est pour vous</b><ul>${x.pros.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
            ${x.cons.length?`<div class="con"><b>À savoir</b><ul>${x.cons.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}</div>
          <div class="factions">
            <a href="${href}" target="_blank" rel="noopener">${lab}</a>
            <button class="ghost" data-rm="${r.f.id}">${md.seen}</button>
          </div>
        </div></article>`;}).join("")}
      <div class="row">
        <button class="ghost" id="redo">Refaire le questionnaire</button>
        <button class="btn" id="more">Voir 6 de plus</button>
      </div>
    </section>`;
    app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.removed.add(+b.dataset.rm);render();});
    app.querySelector("#more").onclick=()=>{S.shown+=6;render();};
    app.querySelector("#redo").onclick=()=>{reset();S.step="intro";render();};
  }
}
function next(){
  const Q=M().Q;
  if(S.q<Q.length-1){S.q++;}
  else if(S.p<S.n-1){S.p++;S.step="pass";}
  else{S.step="res";S.shown=6;}
  render(); window.scrollTo({top:0});
}
function back(){
  if(S.q>0)S.q--;
  else if(S.p>0){S.p--;S.q=M().Q.length-1;}
  else S.step="intro";
  render();
}
render();
</script>
